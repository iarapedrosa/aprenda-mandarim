<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Aprenda Mandarim</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Aprenda mandarim do zero e pratique todos os dias: pinyin e tons, caracteres, escrita, leitura, escuta e fala — tudo em português."
    />
    <meta name="theme-color" content="#b3261e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mandarim" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+SC:wght@400;700&display=swap"
    />
    <script>
      // Aplica o tema salvo antes do Angular iniciar (evita "piscar" o tema errado).
      try {
        var p = JSON.parse(localStorage.getItem('aprenda-mandarim:tema') || '"sistema"');
        var escuro = p === 'escuro' || (p === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Ative o JavaScript para usar este site.</noscript>
  </body>
</html>
